[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fine-t-cell"
dynamic = ["version"]
description = "Predict T-cell response for peptide sequences with the FINE-T model"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Josua Stadelmaier", email = "josua.stadelmaier@gmail.com"},
]
keywords = ["T-cell response", "immunogenicity", "epitope", "peptide", "MHC", "transformer"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=1.10",
    "pandas>=1.4",
    "numpy>=1.21",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/JosuaStadelmaier/T-cell-response-prediction"
Paper = "https://link.springer.com/article/10.1186/s12859-026-06492-2"

[project.scripts]
fine-t-cell = "finetcell.cli:main"

[tool.setuptools]
packages = ["finetcell"]

[tool.setuptools.package-data]
finetcell = ["saved_models/*.tar"]

[tool.setuptools.dynamic]
version = {attr = "finetcell.__version__"}
